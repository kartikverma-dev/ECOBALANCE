name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Run logic tests
        run: npm test

      - name: Create Android project and copy web app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcoBalance-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EcoBalance Android App v1.0.${{ github.run_number }}
          body: |
            ## 🌿 EcoBalance Android APK

            **BCA Project - Eva Tomar (Roll No: 240935106093)**
            **Institute of Management Studies Ghaziabad (2024 - 2027)**

            ### Modules Included:
            - **My Impact:** Carbon footprint & Eco Score
            - **Energy & Solar:** Rooftop Solar, generation, PM Surya Ghar subsidy & ROI
            - **Money:** Utility spend breakdown & savings simulator
            - **Give Back to Nature:** Personalized actions, Eco Points, badges & K-Means profile
            - **Analytics:** Trends & Linear Regression next-month electricity forecasting
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  test-python-backend:
    name: Test Python ML Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Test ML training & calculations
        run: |
          python backend/train_models.py
          python backend/test_calculations.py
